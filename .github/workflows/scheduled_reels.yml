name: AutoPilot Instagram Reels Publisher

on:
  schedule:
    # 11:00 AM IST = 05:30 UTC
    - cron: '30 5 * * *'
    # 05:45 PM IST = 12:15 UTC
    - cron: '15 12 * * *'
  workflow_dispatch:
    inputs:
      force:
        description: 'Force publish next Reel immediately (ignore scheduled time)'
        required: false
        type: boolean
        default: false
      dry_run:
        description: 'Dry run test (downloads video, validates credentials, but does not post)'
        required: false
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  publish_reel:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Install Python Dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run AutoPilot Publisher
        env:
          IG_SESSION_JSON: ${{ secrets.IG_SESSION_JSON }}
          IG_SESSIONID: ${{ secrets.IG_SESSIONID }}
        run: |
          EXTRA_ARGS=""
          if [ "${{ inputs.force }}" = "true" ]; then
            EXTRA_ARGS="$EXTRA_ARGS --force"
          fi
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            EXTRA_ARGS="$EXTRA_ARGS --dry-run"
          fi
          python publish_next_reel.py $EXTRA_ARGS

      - name: Commit and Push Updated Schedule
        run: |
          git config --global user.name "AutoPilot Cloud Bot"
          git config --global user.email "autopilot-bot@users.noreply.github.com"
          git add cloud_schedule.json
          if git diff --staged --quiet; then
            echo "No changes to schedule to commit."
          else
            git commit -m "AutoPilot: updated cloud_schedule.json after publishing [skip ci]"
            git push
          fi

